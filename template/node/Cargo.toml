[package]
name = "orbinum-node"
version = "0.2.0"
license = "Unlicense"
build = "build.rs"
description = "Orbinum Network Node - Privacy-focused blockchain with ZK proofs and EVM compatibility."
publish = false
authors = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
default-run = "orbinum-node"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
async-trait = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = { workspace = true, features = ["std"] }
jsonrpsee = { workspace = true, features = ["server", "macros"] }
libsecp256k1 = { workspace = true, features = ["std", "static-context"] }
log = { workspace = true }
scale-codec = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }

# Substrate
prometheus-endpoint = { workspace = true }
sc-basic-authorship = { workspace = true }
sc-chain-spec = { workspace = true }
sc-cli = { workspace = true }
sc-client-api = { workspace = true }
sc-consensus = { workspace = true }
sc-consensus-aura = { workspace = true }
sc-consensus-grandpa = { workspace = true }
sc-consensus-manual-seal = { workspace = true }
sc-executor = { workspace = true }
sc-network = { workspace = true }
sc-network-sync = { workspace = true }
sc-offchain = { workspace = true }
sc-rpc = { workspace = true }
sc-service = { workspace = true }
sc-telemetry = { workspace = true }
sc-transaction-pool = { workspace = true }
sc-transaction-pool-api = { workspace = true }
sp-api = { workspace = true, features = ["default"] }
sp-block-builder = { workspace = true }
sp-blockchain = { workspace = true }
sp-consensus-aura = { workspace = true, features = ["default"] }
sp-consensus-grandpa = { workspace = true, features = ["default"] }
sp-core = { workspace = true, features = ["default"] }
sp-inherents = { workspace = true, features = ["default"] }
sp-io = { workspace = true, features = ["default"] }
sp-offchain = { workspace = true, features = ["default"] }
sp-runtime = { workspace = true, features = ["default"] }
sp-session = { workspace = true, features = ["default"] }
sp-state-machine = { workspace = true, features = ["default"] }
sp-storage = { workspace = true, features = ["default"] }
sp-timestamp = { workspace = true, features = ["default"] }
sp-transaction-pool = { workspace = true, features = ["default"] }
# These dependencies are used for RPC
frame-system-rpc-runtime-api = { workspace = true }
pallet-relayer = { workspace = true, features = ["std"] }
pallet-relayer-rpc = { workspace = true }
# ISMP RPC: the read path relayers use to discover our outbound messages.
pallet-ismp-rpc = { workspace = true }
pallet-ismp-runtime-api = { workspace = true, default-features = false, features = ["std"] }
pallet-relayer-runtime-api = { workspace = true }
pallet-shielded-pool-runtime-api = { workspace = true }
pallet-transaction-payment-rpc = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }
pallet-zk-verifier-rpc = { workspace = true }
pallet-zk-verifier-runtime-api = { workspace = true }
substrate-frame-rpc-system = { workspace = true }

# These dependencies are used for runtime benchmarking
frame-benchmarking = { workspace = true }
frame-benchmarking-cli = { workspace = true }
frame-metadata-hash-extension = { workspace = true }
frame-system = { workspace = true }
pallet-transaction-payment = { workspace = true }
sp-keystore = { workspace = true }

# Frontier
fc-api = { workspace = true }
fc-cli = { workspace = true }
fc-consensus = { workspace = true }
fc-db = { workspace = true }
fc-mapping-sync = { workspace = true }
fc-rpc = { workspace = true, features = ["aura"] }
fc-rpc-core = { workspace = true }
fc-rpc-v2 = { workspace = true }
fc-storage = { workspace = true }
fp-dynamic-fee = { workspace = true, features = ["default"] }
fp-rpc = { workspace = true, features = ["default"] }

# Orbinum: ZK primitives with native Poseidon host interface
orbinum-runtime = { workspace = true, features = ["std"] }
orbinum-zk-core = { workspace = true, features = ["std"] }

# Cumulus primitives
cumulus-primitives-proof-size-hostfunction = { workspace = true }

[build-dependencies]
substrate-build-script-utils = { workspace = true }

[features]
default = [
	"rocksdb",
	"sql",
	"txpool",
	"rpc-binary-search-estimate",
	"poseidon-native",
]
poseidon-native = [
	"orbinum-zk-core/poseidon-native",
]
# Point the ISMP coprocessor at Hyperbridge's testnet deployment (para 4009, relay
# Kusama, currently Paseo) instead
# of Polkadot mainnet (3367). Forwarded to the runtime, which is where the constant
# lives — without this passthrough the flag is unreachable from a node build, which is
# the only way anyone actually produces a testnet binary.
#
#   cargo build --release -p orbinum-node --features hyperbridge-testnet
hyperbridge-testnet = [
	"orbinum-runtime/hyperbridge-testnet",
]
rocksdb = [
	"sc-cli/rocksdb",
	"sc-service/rocksdb",
	"fc-cli/rocksdb",
	"fc-db/rocksdb",
	"fc-mapping-sync/rocksdb",
	"fc-rpc/rocksdb",
	"orbinum-runtime/with-rocksdb-weights",
]
paritydb = [
	"orbinum-runtime/with-paritydb-weights",
]
sql = [
	"fc-db/sql",
	"fc-mapping-sync/sql",
]
txpool = ["fc-rpc/txpool"]
rpc-binary-search-estimate = ["fc-rpc/rpc-binary-search-estimate"]
runtime-benchmarks = [
	"sc-service/runtime-benchmarks",
	"orbinum-runtime/runtime-benchmarks",
]
skip-proof-verification = ["orbinum-runtime/skip-proof-verification"]
