[package]
name = "orbinum-runtime"
version = "0.2.0"
license = "Apache-2.0 OR GPL-3.0-or-later"
description = "Orbinum Privacy Chain Runtime"
publish = false
authors = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
ethereum = { workspace = true }
hex-literal = { workspace = true }
libsecp256k1 = { workspace = true }
scale-codec = { workspace = true }
scale-info = { workspace = true }
serde_json = { workspace = true, default-features = false, features = [
	"alloc",
] }

# Substrate
sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-consensus-aura = { workspace = true }
sp-consensus-grandpa = { workspace = true }
sp-core = { workspace = true }
sp-genesis-builder = { workspace = true }
sp-inherents = { workspace = true }
sp-io = { workspace = true }
sp-offchain = { workspace = true }
sp-runtime = { workspace = true }
sp-session = { workspace = true }
sp-std = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-version = { workspace = true }
# Substrate FRAME
frame-benchmarking = { workspace = true, optional = true }
frame-executive = { workspace = true }
frame-metadata-hash-extension = { workspace = true }
frame-support = { workspace = true, features = ["experimental"] }
frame-system = { workspace = true }
frame-system-benchmarking = { workspace = true, optional = true }
frame-system-rpc-runtime-api = { workspace = true }
pallet-account-mapping = { workspace = true }
pallet-account-mapping-runtime-api = { workspace = true }
pallet-aura = { workspace = true }
pallet-authorship = { workspace = true }
pallet-balances = { workspace = true, features = ["insecure_zero_ed"] }
pallet-grandpa = { workspace = true }
pallet-session = { workspace = true }
pallet-sudo = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }
pallet-validator-set = { workspace = true }

# Frontier
fp-evm = { workspace = true, features = ["serde"] }
fp-rpc = { workspace = true }
fp-self-contained = { workspace = true, features = ["serde"] }
# Frontier FRAME
pallet-base-fee = { workspace = true }
pallet-dynamic-fee = { workspace = true }
pallet-ethereum = { workspace = true }
pallet-evm = { workspace = true }
pallet-evm-chain-id = { workspace = true }
pallet-evm-precompile-account-mapping = { workspace = true }
pallet-evm-precompile-balances = { workspace = true }
pallet-evm-precompile-curve25519 = { workspace = true }
pallet-evm-precompile-curve25519-benchmarking = { workspace = true }
pallet-evm-precompile-modexp = { workspace = true }
pallet-evm-precompile-sha3fips = { workspace = true }
pallet-evm-precompile-sha3fips-benchmarking = { workspace = true }
pallet-evm-precompile-shielded-pool = { workspace = true }
pallet-evm-precompile-simple = { workspace = true }

# Orbinum Privacy
pallet-relayer = { workspace = true }
pallet-relayer-runtime-api = { workspace = true }
pallet-shielded-pool = { workspace = true }
pallet-shielded-pool-runtime-api = { workspace = true }
pallet-zk-verifier = { workspace = true }
pallet-zk-verifier-runtime-api = { workspace = true }

# Polkadot
polkadot-runtime-common = { workspace = true }

# Cumulus primitives
cumulus-pallet-weight-reclaim = { workspace = true }

[build-dependencies]
substrate-wasm-builder = { workspace = true, optional = true, features = ["metadata-hash"] }

[features]
default = ["std", "with-rocksdb-weights", "poseidon-native-runtime"]
with-rocksdb-weights = []
with-paritydb-weights = []

poseidon-native-runtime = [
	"pallet-shielded-pool/poseidon-native",
]

std = [
	"ethereum/std",
	"scale-codec/std",
	"scale-info/std",
	# Substrate
	"sp-api/std",
	"sp-block-builder/std",
	"sp-consensus-aura/std",
	"sp-consensus-grandpa/std",
	"sp-core/std",
	"sp-genesis-builder/std",
	"sp-inherents/std",
	"sp-io/std",
	"sp-offchain/std",
	"sp-runtime/std",
	"sp-session/std",
	"sp-std/std",
	"sp-transaction-pool/std",
	"sp-version/std",
	"substrate-wasm-builder",
	# Substrate FRAME
	"frame-benchmarking/std",
	"frame-executive/std",
	"frame-metadata-hash-extension/std",
	"frame-support/std",
	"frame-system/std",
	"frame-system-rpc-runtime-api/std",
	"frame-system-benchmarking?/std",
	"pallet-aura/std",
	"pallet-authorship/std",
	"pallet-account-mapping/std",
	"pallet-account-mapping-runtime-api/std",
	"pallet-balances/std",
	"pallet-grandpa/std",
	"pallet-session/std",
	"pallet-sudo/std",
	"pallet-validator-set/std",
	"pallet-timestamp/std",
	"pallet-transaction-payment/std",
	"pallet-transaction-payment-rpc-runtime-api/std",
	# Frontier
	"fp-evm/std",
	"fp-rpc/std",
	"fp-self-contained/std",
	# Frontier FRAME
	"pallet-base-fee/std",
	"pallet-dynamic-fee/std",
	"pallet-ethereum/std",
	"pallet-evm/std",
	"pallet-evm-chain-id/std",
	"pallet-evm-precompile-modexp/std",
	"pallet-evm-precompile-sha3fips/std",
	"pallet-evm-precompile-sha3fips-benchmarking/std",
	"pallet-evm-precompile-simple/std",
	"pallet-evm-precompile-curve25519/std",
	"pallet-evm-precompile-curve25519-benchmarking/std",
	"pallet-evm-precompile-account-mapping/std",
	"pallet-evm-precompile-balances/std",
	"pallet-evm-precompile-shielded-pool/std",
	# Orbinum Privacy
	"pallet-zk-verifier/std",
	"pallet-relayer/std",
	"pallet-relayer-runtime-api/std",
	"pallet-shielded-pool/std",
	"pallet-shielded-pool/poseidon-native",
	"pallet-shielded-pool-runtime-api/std",
	"pallet-zk-verifier-runtime-api/std",
	# Polkadot
	"polkadot-runtime-common/std",
	# Cumulus primitives
	"cumulus-pallet-weight-reclaim/std",
]

runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-system-benchmarking/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-account-mapping/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-grandpa/runtime-benchmarks",
	"pallet-timestamp/runtime-benchmarks",
	"pallet-sudo/runtime-benchmarks",
	"pallet-ethereum/runtime-benchmarks",
	"pallet-evm/runtime-benchmarks",
	"pallet-evm-precompile-curve25519-benchmarking/runtime-benchmarks",
	"pallet-evm-precompile-sha3fips-benchmarking/runtime-benchmarks",
	"pallet-zk-verifier/runtime-benchmarks",
	"pallet-shielded-pool/runtime-benchmarks",
	"pallet-relayer/runtime-benchmarks",
	"pallet-validator-set/runtime-benchmarks",
	"polkadot-runtime-common/runtime-benchmarks",
]

skip-proof-verification = [
	"pallet-zk-verifier/skip-proof-verification",
	"pallet-shielded-pool/skip-proof-verification",
]

try-runtime = [
	"cumulus-pallet-weight-reclaim/try-runtime",
	"fp-self-contained/try-runtime",
	"frame-executive/try-runtime",
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-aura/try-runtime",
	"pallet-authorship/try-runtime",
	"pallet-balances/try-runtime",
	"pallet-base-fee/try-runtime",
	"pallet-dynamic-fee/try-runtime",
	"pallet-ethereum/try-runtime",
	"pallet-evm/try-runtime",
	"pallet-evm-chain-id/try-runtime",
	"pallet-grandpa/try-runtime",
	"pallet-relayer/try-runtime",
	"pallet-session/try-runtime",
	"pallet-shielded-pool/try-runtime",
	"pallet-sudo/try-runtime",
	"pallet-timestamp/try-runtime",
	"pallet-transaction-payment/try-runtime",
	"pallet-validator-set/try-runtime",
	"pallet-zk-verifier/try-runtime",
	"polkadot-runtime-common/try-runtime",
	"sp-runtime/try-runtime",
]
