[package]
name = "pallet-shielded-pool-runtime-api"
version = "0.4.1"
authors = { workspace = true }
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
pallet-shielded-pool = { path = "..", default-features = false }
sp-api = { version = "43.0.0", default-features = false }
sp-core = { version = "43.0.0", default-features = false }
sp-runtime = { version = "48.0.0", default-features = false }

[features]
default = ["std"]
std = [
	"pallet-shielded-pool/std",
	"sp-api/std",
	"sp-core/std",
	"sp-runtime/std",
]
