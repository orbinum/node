# Tesseract relayer — Orbinum <-> Hyperbridge on Paseo
#
# TEMPLATE. Copy it, fill the two `signer` lines, and keep that copy out of the
# repository — Tesseract does not expand environment variables in this file, so the seeds
# have to be written in literally.
#
# ── Running it ────────────────────────────────────────────────────────────────
#   cp relayer.paseo.toml relayer.toml
#   $EDITOR relayer.toml          # both signer lines
#
#   docker run --network=host --platform linux/amd64 \
#     -v $PWD/relayer.toml:/root/relayer.toml \
#     polytopelabs/tesseract:latest \
#     --config=/root/relayer.toml --db=/root/relayer.db
#
# The daemon restarts itself until the node it points at has synced enough to answer;
# that is expected on a fresh box. Add `log-consensus-state KUSAMA-4009` as a final
# argument to print a consensus blob instead of running the relayer — that subcommand is
# read-only and needs no signer.
#
# ── Checking it works ─────────────────────────────────────────────────────────
# This number must climb. It is Hyperbridge's view of Orbinum's height, and it only
# advances when Hyperbridge accepts one of our GRANDPA proofs:
#
#   curl -s -H 'Content-Type: application/json' \
#     -d '{"jsonrpc":"2.0","id":1,"method":"ismp_queryStateMachineLatestHeight",
#          "params":[{"state_id":"SUBSTRATE-orbi","consensus_state_id":"ORBI"}]}' \
#     https://gargantua.rpc.polytope.technology
#
# Anyone may run one of these. The relayer holds no authority — it carries proofs, and a
# forged one is rejected by verification on the receiving side. Postman, not notary.
#
# Exchanges GRANDPA finality proofs in both directions. Neither side trusts the
# relayer: each verifies the other's proofs cryptographically, which is what lets
# Orbinum stay sovereign instead of becoming a parachain.
#
# ── Format note ───────────────────────────────────────────────────────────────
# This targets the CONSOLIDATED `tesseract` binary, the only one that exists on
# `main` (`tesseract/relayer`, plus `tesseract-prover`). The published
# `developers/polkadot/solochains` page still shows the older two-binary layout
# with `polytopelabs/tesseract-consensus` and `[chain.grandpa]` sections; that
# binary is gone. The shape below follows `tesseract/relayer/src/config.rs` and
# the `developers/network/relayer` page, which use `[chain.consensus]`.
#
# ── Usage ─────────────────────────────────────────────────────────────────────
# Read Hyperbridge's initial consensus state, to bootstrap our side:
#
#   docker run --network=host \
#     -v $PWD/scripts/hyperbridge/relayer.paseo.toml:/root/relayer.toml \
#     polytopelabs/tesseract:latest \
#     --config=/root/relayer.toml --db=/root/relayer.db \
#     log-consensus-state KUSAMA-4009
#
# Read OUR initial consensus state, to hand to Hyperbridge in the onboarding issue:
#
#   ... log-consensus-state SUBSTRATE-orbi
#
# Both subcommands are one-shot. Omit the subcommand to run the relayer as a daemon.
#
# ── Requirement ───────────────────────────────────────────────────────────────
# Substrate RPCs must expose unsafe methods (`--rpc-methods Unsafe`). Tesseract
# calls methods that are off by default; without them it fails at runtime, not at
# startup.

# ── Hyperbridge on Paseo ──────────────────────────────────────────────────────
[hyperbridge]
rpc_ws = "wss://gargantua.rpc.polytope.technology"
# Needed only to submit transactions. `log-consensus-state` is read-only, so it
# can stay empty until the relayer runs as a daemon.
# signer deliberately OMITTED: an empty string is hex-decoded and fails with
# "Invalid seed length". Absent = throwaway key + inbound-only mode.
# Delivering messages requires a real hex seed here.

[hyperbridge.consensus]
type = "grandpa"
# Hyperbridge is a parachain: its GRANDPA finality comes from the RELAY chain
# (Paseo), not from Hyperbridge itself.
rpc = "wss://pas-rpc.stakeworld.io"   # dwellir stopped resolving (2026-08-27)
# Required, not optional: `HostConfig` (tesseract/consensus/grandpa/src/lib.rs:85)
# has no default, so omitting it fails with "missing field `slot_duration`" before
# the relayer connects to anything. 6000 on Paseo; Polkadot mainnet would be 12000.
slot_duration = 6000
# How often to exchange consensus proofs, per the upstream docs.
consensus_update_frequency = 60
# Hyperbridge's para id on Paseo. Listing it is what makes the relayer ship
# proofs that verify Hyperbridge *through* its relay's GRANDPA.
para_ids = [4009]
# How far ahead of the stored consensus state one proof may reach. The default is
# 2400 (`tesseract/consensus/grandpa/src/lib.rs:39`), which cannot recover from
# being behind: Paseo produces ~14400 blocks a day, so a relayer limited to 2400
# per cycle falls further behind each cycle and never converges. That is exactly
# what happened here — the stored state sat at relay block 909397 while Paseo was
# at 974819, and the HB -> Orbinum direction produced nothing for hours with no
# error, because the grandpa loop swallows them.
max_block_range = 10000

# ── Orbinum ───────────────────────────────────────────────────────────────────
[orbinum]
type = "substrate"
rpc_ws = "wss://rpc-1.testnet.orbinum.io"
# signer deliberately OMITTED: an empty string is hex-decoded and fails with
# "Invalid seed length". Absent = throwaway key + inbound-only mode.
# Delivering messages requires a real hex seed here.
# Our consensus state id ON Hyperbridge — 4 UTF-8 chars we choose. Distinct from
# the state machine id (`SUBSTRATE-orbi`), though kept related for legibility.
consensus_state_id = "ORBI"

[orbinum.consensus]
type = "grandpa"
# Orbinum is standalone, so this points at Orbinum itself.
rpc = "wss://rpc-1.testnet.orbinum.io"
# Orbinum's own block time, and the value the runtime whitelists Hyperbridge with
# (`HYPERBRIDGE_SLOT_DURATION_MS`). Required, same as above.
slot_duration = 6000
consensus_update_frequency = 60
# Empty: we are not a relay chain with parachains to prove.
para_ids = []

# ── Watchdog ──────────────────────────────────────────────────────────────────
[relayer]
# Restart if either consensus client goes stale. A silently stalled relayer looks
# identical to a quiet one, so this timeout is the only signal.
#
# 900s, not the 180s this started with: that was a guess, and it was wrong in the
# direction that matters. Measured on 2026-09-07, the first Orbinum -> Hyperbridge proof
# took ~3 min from startup, and Hyperbridge's BEEFY proofs coming back are slower to build
# than our GRANDPA ones. At 180s the watchdog fired before the first inbound update landed
# and restarted the relayer, which restarted the clock — a loop that never completes.
# Long enough to let a slow first cycle finish, short enough to still catch a real stall.
maximum_update_intervals = [
    [{ state_id = "KUSAMA-4009", consensus_state_id = "PAS0" }, 900],
    [{ state_id = "SUBSTRATE-orbi", consensus_state_id = "ORBI" }, 900],
]
