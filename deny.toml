# cargo-deny configuration for Orbinum development
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Exclude dev dependencies from license checks to reduce noise
exclude-dev = true

[advisories]
# Ignore advisories for transitive dependencies that cannot be resolved
# without upgrading polkadot-sdk or ZK crates upstream.
ignore = [
    # The 17 wasmtime advisories that lived here were pinned by stable2512's wasmtime
    # 35.0.0 — three of them sandbox escapes. SDK 2606 brings wasmtime 36.0.14, which
    # fixes every one: with this list emptied, `cargo deny check advisories` reports none
    # of them against the current graph. Re-check on the next SDK bump rather than
    # re-adding blind; an ignore that suppresses nothing hides the ones that do.

    # tracing-subscriber 0.2.25 — pinned by ark-relations (ZK crates), no upgrade path
    "RUSTSEC-2025-0055",

    # webpki-roots 0.25.4 (distrusted emSign roots) — pinned by libp2p-websocket 0.44
    # through sc-network's libp2p 0.54; fixed only in 1.0.10. Those roots validate the
    # TLS of `wss` p2p dials, and peers are still authenticated by Noise and peer id.
    "RUSTSEC-2026-0381",

    # libsqlite3-sys 0.30.1 (bundled SQLite before 3.54) — pinned by sqlx 0.8 through
    # frontier's fc-db SQL backend; fixed only in 0.39, which needs a newer sqlx. The node
    # opens only its own database under its base path; the flaw needs a crafted db/-wal pair.
    "RUSTSEC-2026-0459",

    # zstd-safe 6.0.6 (uninitialized memory on a failed legacy-frame decompression) — from
    # zstd 0.12 through polkadot-node-primitives → cumulus-relay-chain-interface →
    # frame-benchmarking-cli; the 6.x line has no fix. Parachain PoV code a solochain never
    # runs, reachable only from the benchmark CLI.
    "RUSTSEC-2026-0403",

    # crypto-bigint 0.5.5 (non-constant-time ops) — pinned by elliptic-curve 0.13 through
    # k256 0.13 (alloy, from ismp-abi); fixed only in 0.7.6, which needs elliptic-curve
    # 0.14. Here k256 hashes, recovers and verifies public data; no secret key is used.
    "RUSTSEC-2026-0387",

    # hickory-proto 0.24.4 / 0.25.2 — from libp2p-dns (libp2p 0.54) and litep2p 0.14 through
    # sc-network; fixed only in 0.26.2, and sc-network 0.61 still pins libp2p 0.54. 0487,
    # 0489 and 0490 panic when parsing zone files or record text, which the node never does.
    # 0491 over-allocates (~18 MB, freed when decoding fails) on a DNS response with forged
    # record counts, reachable only by spoofing replies to the node's `/dns` multiaddr lookups.
    # 0504, 0505, 0511, 0512 (hickory-proto) and 0514 (hickory-resolver) are flaws in DNSSEC
    # validation, compiled only with hickory's `dnssec*` features, which nothing in the graph
    # enables.
    "RUSTSEC-2026-0487",
    "RUSTSEC-2026-0489",
    "RUSTSEC-2026-0490",
    "RUSTSEC-2026-0491",
    "RUSTSEC-2026-0504",
    "RUSTSEC-2026-0505",
    "RUSTSEC-2026-0511",
    "RUSTSEC-2026-0512",
    "RUSTSEC-2026-0514",

    # Unmaintained — all transitive, no direct upgrade path
    "RUSTSEC-2025-0161",  # libsecp256k1 0.7.2 (from frontier fp-evm/pallet-evm)
    "RUSTSEC-2026-0119",  # hickory-proto 0.24.x (from libp2p-dns → sc-network)
    "RUSTSEC-2026-0118",  # hickory-proto 0.25.x (from libp2p-dns → sc-network)
    "RUSTSEC-2024-0388",  # derivative 2.2.0 (from ark-r1cs-std)
    "RUSTSEC-2025-0057",  # fxhash 0.2.1 (from cranelift)
    "RUSTSEC-2024-0384",  # instant 0.1.13 (from parking_lot)
    "RUSTSEC-2022-0061",  # parity-wasm 0.45.0 (from sc-executor-common)
    "RUSTSEC-2024-0436",  # paste 1.0.15 (from wasmtime-runtime)
    "RUSTSEC-2024-0370",  # proc-macro-error 1.0.4 (from multihash)
    "RUSTSEC-2026-0173",  # proc-macro-error2 2.0.1 (from subxt-macro → frame-benchmarking-cli)
    "RUSTSEC-2026-0441",  # pin-utils 0.1.0 (from wasm-timer → sc-network)
]

[licenses]
# Allow common open source licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",        # ICU4X crates (zerovec, yoke, tinystr, etc.)
    "Unlicense",
    "0BSD",
    "Zlib",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "GPL-3.0-or-later WITH Classpath-exception-2.0",  # Polkadot SDK / Substrate
    "CC0-1.0",            # unicode-ident and other crates
    "MPL-2.0",            # webpki-roots
    "BSL-1.0",            # xxhash-rust (Boost Software License 1.0)
    "CDLA-Permissive-2.0", # Community Data License Agreement - webpki-root-certs
]

# Exception for crates with deprecated SPDX syntax (from Polkadot SDK)
[[licenses.exceptions]]
name = "array-bytes"
version = "6.2.3"
allow = ["Apache-2.0", "GPL-3.0-only"]

# Polkadot SDK uses GPL-3.0 with Classpath exception
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
# Warn on multiple versions of the same crate
multiple-versions = "warn"
# Skip checking git dependencies during development
wildcards = "allow"

[sources]
# Allow crates from crates.io and git
unknown-registry = "deny"
unknown-git = "allow"
