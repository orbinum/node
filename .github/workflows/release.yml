name: Release & Deploy

# Triggers:
#   - Tag push v*.*.* → full release: build binary + WASM + deploy to testnet
#   - workflow_dispatch → manual deploy (elegir ambiente)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "testnet"
        type: choice
        options:
          - testnet
          - mainnet
      deploy_runtime:
        description: "Deploy runtime upgrade on-chain"
        required: true
        default: true
        type: boolean
      image_tag:
        description: "Published image tag to deploy the runtime from (e.g. 0.1.0-rc.10). Extracts the WASM from ghcr.io/<owner>/node:<tag> instead of recompiling."
        required: true
        default: "testnet-latest"
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # nunca cancelar un deploy en progreso

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"
  BINARY_NAME: "orbinum-node"
  RUNTIME_WASM: "target/release/wbuild/orbinum-runtime/orbinum_runtime.compact.compressed.wasm"

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  # ── 1. Extraer metadata del tag/versión ───────────────────────────────────
  metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      environment: ${{ steps.meta.outputs.environment }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necesario para git verify-tag

      - name: Verify GPG tag signature
        if: github.event_name == 'push'
        env:
          RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
        run: |
          echo "$RELEASE_GPG_PUBLIC_KEY" | gpg --import
          git fetch origin "+refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}" --force
          git verify-tag "refs/tags/${{ github.ref_name }}"

      - name: Compute metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.sha }}"
            ENV="${{ github.event.inputs.environment }}"
            IS_PRE="true"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            # rc / alpha / beta tags van a testnet
            if [[ "$VERSION" =~ -(rc|alpha|beta|pre) ]]; then
              IS_PRE="true"
              ENV="testnet"
            else
              IS_PRE="false"
              ENV="testnet"   # mainnet requiere aprobación manual — ver deployment protection
            fi
          fi
          echo "version=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "environment=$ENV"        >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRE"   >> "$GITHUB_OUTPUT"

  # ── 2. Build del binario y runtime WASM ──────────────────────────────────
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Rust toolchain
        run: make setup

      - name: Build release binary and WASM
        run: |
          # The coprocessor is a compile-time constant: a testnet release must carry the
          # hyperbridge-testnet feature or it ships mainnet's `Polkadot(3367)`.
          if [ "${{ needs.metadata.outputs.environment }}" = "testnet" ]; then
            make build-release FEATURES=hyperbridge-testnet
          else
            make build-release
          fi

      - name: Verify the built runtime targets ${{ needs.metadata.outputs.environment }}
        run: |
          # Reads the coprocessor back off the binary instead of trusting the flag above.
          # A mismatch here is a wrong deployment that would only surface once a relayer
          # tried to work, long after the deploy reported success.
          bash scripts/verify-coprocessor.sh "${{ needs.metadata.outputs.environment }}"

      - name: Verify WASM size (< 1.5 MB)
        run: |
          SIZE=$(wc -c < "${{ env.RUNTIME_WASM }}")
          SIZE_KB=$((SIZE / 1024))
          echo "Runtime WASM size: ${SIZE_KB} KB"
          if [ $SIZE -gt $((1536 * 1024)) ]; then
            echo "ERROR: Runtime WASM ${SIZE_KB} KB supera el límite de 1.5 MB"
            exit 1
          fi

      - name: Compute checksums
        run: |
          sha256sum target/release/${{ env.BINARY_NAME }} > target/release/${{ env.BINARY_NAME }}.sha256
          sha256sum ${{ env.RUNTIME_WASM }} > ${{ env.RUNTIME_WASM }}.sha256
          echo "Binary SHA256:"
          cat target/release/${{ env.BINARY_NAME }}.sha256
          echo "WASM SHA256:"
          cat ${{ env.RUNTIME_WASM }}.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbinum-node-${{ needs.metadata.outputs.version }}
          path: |
            target/release/${{ env.BINARY_NAME }}
            target/release/${{ env.BINARY_NAME }}.sha256
          retention-days: 30

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbinum-runtime-wasm-${{ needs.metadata.outputs.version }}
          path: |
            ${{ env.RUNTIME_WASM }}
            ${{ env.RUNTIME_WASM }}.sha256
          retention-days: 30

  # ── 3. Deploy runtime on-chain ─────────────────────
  deploy-runtime:
    name: Runtime Upgrade (on-chain)
    runs-on: ubuntu-latest
    needs: [metadata]
    if: github.event.inputs.deploy_runtime == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract runtime WASM from published image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/node:${{ github.event.inputs.image_tag }}"
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"
          mkdir -p ./artifacts
          CID=$(docker create "$IMAGE")
          docker cp "$CID:/usr/local/share/orbinum/orbinum_runtime.compact.compressed.wasm" \
            ./artifacts/orbinum_runtime.compact.compressed.wasm
          docker rm "$CID"
          ls -l ./artifacts

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deploy dependencies
        run: npm install --prefix ./scripts @polkadot/api @polkadot/keyring

      - name: Deploy runtime upgrade to ${{ needs.metadata.outputs.environment }}
        env:
          RPC_URL: ${{ secrets.TESTNET_RPC_WS }}
          SUDO_SEED: ${{ secrets.TESTNET_SUDO_SEED }}
        run: |
          WASM_FILE=$(find ./artifacts -name "*.wasm" | head -1)
          echo "Deploying WASM: $WASM_FILE"
          bash scripts/deploy-runtime.sh "$WASM_FILE" "$RPC_URL" "$SUDO_SEED"

      - name: Verify runtime upgrade
        env:
          RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
        run: bash scripts/healthcheck.sh --check-runtime "$RPC_URL"

  # ── 4. Publicar imagen Docker en GHCR ────────────────────────────────────
  # El binario de los nodos se actualiza vía Watchtower siguiendo `testnet-latest`.
  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [metadata, build]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      # Same reason as the `build` job, plus one more: `load: true` below materialises
      # the image in the runner's local store on top of the build cache, so this job now
      # needs headroom for both. A stock runner has ~14 GB free.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/node
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.metadata.outputs.is_prerelease == 'false' }}
            type=raw,value=testnet-latest,enable=${{ needs.metadata.outputs.is_prerelease == 'true' }}

      # Build, verify, then push — in that order, deliberately. This image is what
      # Watchtower installs on the validators, and `deploy-runtime` extracts the runtime
      # WASM from it for the on-chain setCode. The `build` job verifies its own binary,
      # but that binary is not this image: this job compiles independently, so a wrong
      # `build-args` here passes `build` green and ships the wrong deployment. Once a tag
      # is pushed to GHCR the nodes may pull it before anyone can delete it, so the check
      # has to gate the push rather than follow it.
      #
      # `load: true` (instead of platforms: linux/amd64) puts the image in the runner's
      # local store so it can be inspected; the runner is amd64, so the artifact is the
      # same. The push step repeats identical inputs and is served from cache.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          # Same feature selection as the binary build above: the image the validators
          # actually run must target the same deployment as the runtime being deployed.
          build-args: |
            CARGO_FEATURES=${{ needs.metadata.outputs.environment == 'testnet' && 'hyperbridge-testnet' || '' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          # ignore-error: a flaky gha cache backend (intermittent "not_found" on
          # export) must not fail a job whose image already pushed successfully.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Verify the image targets ${{ needs.metadata.outputs.environment }}
        run: |
          # Reads the coprocessor back out of the image's own binary. Testnet must report
          # Kusama(4009) — the identifier Hyperbridge's Paseo deployment uses, per their
          # solochain docs — and mainnet Polkadot(3367).
          #
          # The binary is copied out and run on the runner rather than inside the
          # container: verify-coprocessor.sh binds RPC to localhost only, so an in-
          # container node would need --network host to be reachable anyway. This works
          # because the runner (ubuntu-latest) and the image (debian:bookworm-slim) are
          # both amd64 glibc with libssl3. If this step ever fails with a loader error
          # rather than a coprocessor mismatch, that assumption is what broke.
          # metadata-action emits several tags; they all name the same image, so any one
          # works. Fail loudly rather than run `docker create ""` if the list is empty.
          IMAGE=$(echo "${{ steps.docker_meta.outputs.tags }}" | head -1)
          if [ -z "$IMAGE" ]; then
            echo "No tag produced by docker_meta — nothing to verify." >&2
            exit 1
          fi
          echo "Verifying $IMAGE"
          CID=$(docker create "$IMAGE")
          docker cp "$CID:/usr/local/bin/orbinum-node" ./node-from-image
          docker rm "$CID"
          chmod +x ./node-from-image
          bash scripts/verify-coprocessor.sh \
            "${{ needs.metadata.outputs.environment }}" ./node-from-image

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            CARGO_FEATURES=${{ needs.metadata.outputs.environment == 'testnet' && 'hyperbridge-testnet' || '' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          # Deliberately no `platforms:` — it must match the Build step above or the two
          # get different cache keys, which would recompile the node from scratch here
          # (~25 min) and push an image other than the one just verified. The runner is
          # amd64, so the default single-platform build produces linux/amd64 either way.

  # ── 6. Crear GitHub Release ───────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [metadata, build]
    # Solo en tags reales (no workflow_dispatch)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts/

      - name: Package artifacts
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          find release-artifacts/ -name "orbinum-node" -not -name "*.sha256" \
            | xargs -I{} cp {} orbinum-node-linux-x86_64-${VERSION}
          find release-artifacts/ -name "*.wasm" \
            | xargs -I{} cp {} orbinum-runtime-${VERSION}.wasm
          sha256sum orbinum-node-linux-x86_64-${VERSION} >> checksums.txt
          sha256sum orbinum-runtime-${VERSION}.wasm >> checksums.txt

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## Orbinum Node ${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          if [[ -n "$PREV_TAG" ]]; then
            echo "### Changes since ${PREV_TAG}" >> release_notes.md
            git log --oneline "${PREV_TAG}..HEAD" --no-merges >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "### Checksums" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          cat checksums.txt >> release_notes.md
          echo "\`\`\`" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Orbinum ${{ needs.metadata.outputs.version }}"
          body_path: release_notes.md
          prerelease: ${{ needs.metadata.outputs.is_prerelease == 'true' }}
          files: |
            orbinum-node-linux-x86_64-${{ needs.metadata.outputs.version }}
            orbinum-runtime-${{ needs.metadata.outputs.version }}.wasm
            checksums.txt
