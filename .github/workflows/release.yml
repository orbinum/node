name: Release

# One `vX.Y.Z` tag per release, built once per network: the hyperbridge coprocessor
# is a compile-time feature, so each network gets its own binary.
#
#   - Tag push → testnet: image `X.Y.Z-testnet` + `testnet-latest`, GitHub pre-release.
#   - Dispatch with environment=mainnet → mainnet build of the same tag: image `X.Y.Z`
#     + `latest`, and the release becomes final. environment=testnet rebuilds testnet.
#
# Builds and publishes only; the on-chain runtime upgrade is runtime-upgrade.yml.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      environment:
        description: "Network flavour to build and publish"
        required: true
        default: "mainnet"
        type: choice
        options:
          - testnet
          - mainnet
      version:
        description: "Release version, e.g. 0.2.0 (git tag v0.2.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight publish

env:
  BINARY: "dist/orbinum-node"
  WASM: "dist/orbinum_runtime.compact.compressed.wasm"

jobs:
  # ── 1. Metadata and release gates ──────────────────────────────────────────
  metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # the mainnet gate reads the testnet image
    outputs:
      version: ${{ steps.meta.outputs.version }}
      environment: ${{ steps.meta.outputs.environment }}
      # `X.Y.Z-testnet` or `X.Y.Z`: the two builds differ, so they never share a tag.
      image_tag: ${{ steps.meta.outputs.image_tag }}
      # Testnet builds are pre-releases; the mainnet build makes the release final.
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # required by git verify-tag

      - name: Compute metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            ENV="$INPUT_ENVIRONMENT"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            ENV="testnet"   # a tag push always targets testnet; mainnet is a promotion
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1
          fi
          IMAGE_TAG="$VERSION"; [[ "$ENV" == "testnet" ]] && IMAGE_TAG="$VERSION-testnet"
          IS_PRE=$([[ "$ENV" == "testnet" ]] && echo true || echo false)
          {
            echo "version=$VERSION"
            echo "environment=$ENV"
            echo "image_tag=$IMAGE_TAG"
            echo "is_prerelease=$IS_PRE"
          } >> "$GITHUB_OUTPUT"

      # Runs on promotions too: a tag that failed its testnet run still exists.
      - name: Verify GPG tag signature
        env:
          RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
          TAG: v${{ steps.meta.outputs.version }}
        run: |
          echo "$RELEASE_GPG_PUBLIC_KEY" | gpg --import
          git fetch origin "+refs/tags/$TAG:refs/tags/$TAG" --force
          git verify-tag "refs/tags/$TAG"

      # The binary reports `<crate version>-<sha>` to telemetry and `--version`; a tag
      # that differs from the crate version cannot be traced from what nodes report.
      - name: Tag must match the orbinum-node crate version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Read at the tag: a promotion's checkout is main.
          CRATE=$(git show "v$VERSION:template/node/Cargo.toml" \
            | grep -m1 -E '^version *= *"' | sed -E 's/.*"(.*)".*/\1/')
          if [[ "$VERSION" != "$CRATE" ]]; then
            echo "::error::tag v$VERSION does not match template/node/Cargo.toml version $CRATE — bump the crate (and Cargo.lock) before tagging"
            exit 1
          fi

      - name: Log in to GHCR
        if: steps.meta.outputs.environment == 'mainnet'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mainnet only ships a version that testnet already ran.
      - name: Mainnet promotion requires the testnet release
        if: steps.meta.outputs.environment == 'mainnet'
        env:
          TESTNET_IMAGE: ghcr.io/${{ github.repository_owner }}/node:${{ steps.meta.outputs.version }}-testnet
        run: |
          docker buildx imagetools inspect "$TESTNET_IMAGE" >/dev/null \
            || { echo "::error::$TESTNET_IMAGE not found — ship v${{ steps.meta.outputs.version }} to testnet before promoting it"; exit 1; }

  # ── 2. Build binary and runtime WASM ───────────────────────────────────────
  # One compile, inside the Dockerfile: the release assets, the image and the on-chain
  # runtime all come from the same bytes, linked against the image's glibc.
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      # A release build needs ~20 GB; a stock runner has ~14 GB free.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.metadata.outputs.version }} # the tag, also on a promotion

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No layer cache: `COPY . .` invalidates the compile layer on every release.
      - name: Compile (export `artifacts` stage to ./dist)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: artifacts
          outputs: type=local,dest=dist
          # Without the feature, a testnet build targets mainnet's coprocessor.
          build-args: |
            CARGO_FEATURES=${{ needs.metadata.outputs.environment == 'testnet' && 'hyperbridge-testnet' || '' }}
          platforms: linux/amd64
          provenance: false

      # Reads the coprocessor off the binary rather than trusting the build flag.
      - name: Verify the binary targets ${{ needs.metadata.outputs.environment }}
        run: |
          chmod +x "$BINARY"
          bash scripts/verify-coprocessor.sh "${{ needs.metadata.outputs.environment }}" "$BINARY"

      - name: Verify WASM size (< 1.5 MB)
        run: |
          SIZE=$(wc -c < "$WASM")
          echo "Runtime WASM size: $((SIZE / 1024)) KB"
          if [ "$SIZE" -gt $((1536 * 1024)) ]; then
            echo "ERROR: Runtime WASM $((SIZE / 1024)) KB exceeds the 1.5 MB limit"
            exit 1
          fi

      # From inside dist/, so `sha256sum -c` works wherever the files are downloaded.
      - name: Compute checksums
        run: |
          cd dist && for f in *; do sha256sum "$f" | tee "$f.sha256"; done

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: orbinum-node-${{ needs.metadata.outputs.image_tag }}
          path: |
            ${{ env.BINARY }}
            ${{ env.BINARY }}.sha256
          retention-days: 30

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v5
        with:
          name: orbinum-runtime-wasm-${{ needs.metadata.outputs.image_tag }}
          path: |
            ${{ env.WASM }}
            ${{ env.WASM }}.sha256
          retention-days: 30

  # ── 3. Publish Docker image ────────────────────────────────────────────────
  # Watchtower rolls nodes onto `testnet-latest` / `latest`. No compile here:
  # `build-contexts` swaps in the artifacts verified by `build`.
  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [metadata, build]
    # Pushing `latest` is mainnet's rollout, so it waits for the mainnet reviewer.
    # Testnet runs without an environment: the tag is GPG-checked, and the testnet
    # environment only admits `main`.
    environment: ${{ needs.metadata.outputs.environment == 'mainnet' && 'mainnet' || '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.metadata.outputs.version }} # the tag's Dockerfile wraps the tag's binary

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: orbinum-*-${{ needs.metadata.outputs.image_tag }}
          path: dist
          merge-multiple: true

      - name: Verify checksums match the `build` job
        run: cd dist && sha256sum -c -- *.sha256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/node
          # Raw tags: on a dispatch github.ref is a branch, so `type=semver` yields nothing.
          tags: |
            type=raw,value=${{ needs.metadata.outputs.image_tag }}
            type=raw,value=latest,enable=${{ needs.metadata.outputs.environment == 'mainnet' }}
            type=raw,value=testnet-latest,enable=${{ needs.metadata.outputs.environment == 'testnet' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-contexts: artifacts=./dist
          push: true
          platforms: linux/amd64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      # Runs the pushed image: the artifact round-trip drops the executable bit, and a
      # non-runnable binary would otherwise only fail on the nodes.
      - name: Verify the published image actually runs
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/node@${{ steps.build.outputs.digest }}"
          echo "Running --version inside $IMAGE"
          docker run --rm --entrypoint /usr/local/bin/orbinum-node "$IMAGE" --version
          # runtime-upgrade.yml copies this WASM out for setCode.
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'test -s /usr/local/share/orbinum/orbinum_runtime.compact.compressed.wasm'

      # Every pushed tag, the floating one included, must point at the image just verified.
      - name: Verify every pushed tag resolves to the verified digest
        run: |
          WANT="${{ steps.build.outputs.digest }}"
          # The digest is the sha256 of the raw manifest; no `--format` template needed.
          echo "${{ steps.docker_meta.outputs.tags }}" | while read -r TAG; do
            [ -n "$TAG" ] || continue
            GOT="sha256:$(docker buildx imagetools inspect "$TAG" --raw | sha256sum | cut -d' ' -f1)"
            if [ "$GOT" != "$WANT" ]; then
              echo "::error::$TAG resolves to $GOT, expected $WANT"; exit 1
            fi
            echo "ok  $TAG -> $GOT"
          done

  # ── 4. GitHub Release ──────────────────────────────────────────────────────
  # The tag push creates it (testnet assets, pre-release); the mainnet promotion adds its
  # assets to the same release and makes it final.
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # After the image: a rejected promotion must not leave a final release behind.
    needs: [metadata, build, docker-publish]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.metadata.outputs.version }}
          fetch-depth: 0 # release notes diff against the previous tag

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: orbinum-*-${{ needs.metadata.outputs.image_tag }}
          path: ./release-artifacts/

      # Asset names carry the image tag, so both builds of a release sit side by side.
      - name: Package artifacts
        run: |
          TAG="${{ needs.metadata.outputs.image_tag }}"
          find release-artifacts/ -name "orbinum-node" -not -name "*.sha256" \
            | xargs -I{} cp {} orbinum-node-linux-x86_64-${TAG}
          find release-artifacts/ -name "*.wasm" \
            | xargs -I{} cp {} orbinum-runtime-${TAG}.wasm
          sha256sum orbinum-node-linux-x86_64-${TAG} >> checksums-${TAG}.txt
          sha256sum orbinum-runtime-${TAG}.wasm >> checksums-${TAG}.txt

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          TAG="${{ needs.metadata.outputs.image_tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## Orbinum Node ${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          if [[ -n "$PREV_TAG" ]]; then
            echo "### Changes since ${PREV_TAG}" >> release_notes.md
            git log --oneline "${PREV_TAG}..HEAD" --no-merges >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "### Checksums (${TAG})" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          cat "checksums-${TAG}.txt" >> release_notes.md
          echo "\`\`\`" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          name: "Orbinum ${{ needs.metadata.outputs.version }}"
          # The mainnet run replaces the body; the testnet assets stay attached.
          body_path: release_notes.md
          prerelease: ${{ needs.metadata.outputs.is_prerelease == 'true' }}
          files: |
            orbinum-node-linux-x86_64-${{ needs.metadata.outputs.image_tag }}
            orbinum-runtime-${{ needs.metadata.outputs.image_tag }}.wasm
            checksums-${{ needs.metadata.outputs.image_tag }}.txt
