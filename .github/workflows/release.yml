name: Release

# Version = code, network = build flavour. A release is `vX.Y.Z` — no `-rc`: the
# binary reports `<crate version>-<sha>` to telemetry and `--version`, so the tag IS
# what operators read there. The same tag is built once per network, since the
# hyperbridge coprocessor is a compile-time feature:
#
#   - Tag push vX.Y.Z → testnet flavour: image `X.Y.Z-testnet` + `testnet-latest`
#     (what testnet Watchtower follows), GitHub pre-release.
#   - workflow_dispatch environment=mainnet, version=X.Y.Z → mainnet flavour of that
#     same tag: image `X.Y.Z` + `latest`, the GitHub Release gains the mainnet assets
#     and stops being a pre-release. environment=testnet rebuilds the testnet flavour.
#
# Nothing here touches the chain: the runtime upgrade is runtime-upgrade.yml.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      environment:
        description: "Network flavour to build and publish"
        required: true
        default: "mainnet"
        type: choice
        options:
          - testnet
          - mainnet
      version:
        description: "Release version, e.g. 0.2.0 (git tag v0.2.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight deploy

env:
  BINARY: "dist/orbinum-node"
  WASM: "dist/orbinum_runtime.compact.compressed.wasm"

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  # ── 1. Extract tag/version metadata ───────────────────────────────────────
  metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # the mainnet promotion looks up the testnet image
    outputs:
      version: ${{ steps.meta.outputs.version }}
      environment: ${{ steps.meta.outputs.environment }}
      # `X.Y.Z-testnet` or `X.Y.Z` (mainnet): the two flavours are different bytes and
      # must never share a registry tag.
      image_tag: ${{ steps.meta.outputs.image_tag }}
      # Testnet builds are pre-releases; a release becomes final when mainnet ships it.
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # required by git verify-tag

      - name: Compute metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            ENV="$INPUT_ENVIRONMENT"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            ENV="testnet"   # every tag ships to testnet first; mainnet is a promotion
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1
          fi
          IMAGE_TAG="$VERSION"; [[ "$ENV" == "testnet" ]] && IMAGE_TAG="$VERSION-testnet"
          IS_PRE=$([[ "$ENV" == "testnet" ]] && echo true || echo false)
          {
            echo "version=$VERSION"
            echo "environment=$ENV"
            echo "image_tag=$IMAGE_TAG"
            echo "is_prerelease=$IS_PRE"
          } >> "$GITHUB_OUTPUT"

      # Every run checks the tag it builds, the tag push and a promotion alike: a tag
      # whose testnet run failed these checks still exists and could otherwise be
      # promoted.
      - name: Verify GPG tag signature
        env:
          RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
          TAG: v${{ steps.meta.outputs.version }}
        run: |
          echo "$RELEASE_GPG_PUBLIC_KEY" | gpg --import
          git fetch origin "+refs/tags/$TAG:refs/tags/$TAG" --force
          git verify-tag "refs/tags/$TAG"

      # The binary reports `<orbinum-node version>-<git hash>` (SUBSTRATE_CLI_IMPL_VERSION),
      # which is what telemetry and `--version` show. A tag that does not match that
      # crate version ships a binary nobody can trace back to a release.
      - name: Tag must match the orbinum-node crate version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Read at the tag, not the checkout: a promotion runs on main.
          CRATE=$(git show "v$VERSION:template/node/Cargo.toml" \
            | grep -m1 -E '^version *= *"' | sed -E 's/.*"(.*)".*/\1/')
          if [[ "$VERSION" != "$CRATE" ]]; then
            echo "::error::tag v$VERSION does not match template/node/Cargo.toml version $CRATE — bump the crate (and Cargo.lock) before tagging"
            exit 1
          fi

      - name: Log in to GHCR
        if: steps.meta.outputs.environment == 'mainnet'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mainnet only gets what testnet ran first: a version whose testnet image was never
      # published never had its dress rehearsal.
      - name: Mainnet promotion requires the testnet release
        if: steps.meta.outputs.environment == 'mainnet'
        env:
          TESTNET_IMAGE: ghcr.io/${{ github.repository_owner }}/node:${{ steps.meta.outputs.version }}-testnet
        run: |
          docker buildx imagetools inspect "$TESTNET_IMAGE" >/dev/null \
            || { echo "::error::$TESTNET_IMAGE not found — ship v${{ steps.meta.outputs.version }} to testnet before promoting it"; exit 1; }

  # ── 2. Build binary + runtime WASM (single compile, inside the Dockerfile) ──
  # The Dockerfile is the only build definition. Compiling here and exporting the
  # `artifacts` stage to ./dist means the GitHub Release, the Docker image and the
  # on-chain runtime all come from the same bytes, built against the image's own glibc.
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      # A substrate release build needs ~20 GB; a stock runner has ~14 GB free.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A mainnet promotion builds the released tag, not whatever main is now.
          ref: v${{ needs.metadata.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile (export `artifacts` stage to ./dist)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: artifacts
          outputs: type=local,dest=dist
          # The coprocessor is a compile-time constant: a testnet release must carry the
          # hyperbridge-testnet feature or it ships mainnet's `Polkadot(3367)`.
          build-args: |
            CARGO_FEATURES=${{ needs.metadata.outputs.environment == 'testnet' && 'hyperbridge-testnet' || '' }}
          platforms: linux/amd64
          provenance: false
          # No gha layer cache on purpose: `COPY . .` invalidates the compile layer on
          # every release, so the only thing a cache ever stored was a ~3 GB builder blob
          # that never hit again and evicted the test workflow's cargo cache.

      - name: Verify the binary targets ${{ needs.metadata.outputs.environment }}
        run: |
          # Reads the coprocessor back off the binary instead of trusting the flag above.
          # A mismatch here is a wrong deployment that would only surface once a relayer
          # tried to work, long after the deploy reported success. The binary is built on
          # bookworm (glibc 2.36) and runs on the newer runner glibc; the reverse would
          # not be guaranteed, which is why CI compiles inside the image, not on the runner.
          chmod +x "$BINARY"
          bash scripts/verify-coprocessor.sh "${{ needs.metadata.outputs.environment }}" "$BINARY"

      - name: Verify WASM size (< 1.5 MB)
        run: |
          SIZE=$(wc -c < "$WASM")
          echo "Runtime WASM size: $((SIZE / 1024)) KB"
          if [ "$SIZE" -gt $((1536 * 1024)) ]; then
            echo "ERROR: Runtime WASM $((SIZE / 1024)) KB exceeds the 1.5 MB limit"
            exit 1
          fi

      - name: Compute checksums
        run: |
          # Written from inside dist/ so the recorded paths are bare filenames and
          # `sha256sum -c` works wherever the artifacts are downloaded.
          cd dist && for f in *; do sha256sum "$f" | tee "$f.sha256"; done

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: orbinum-node-${{ needs.metadata.outputs.image_tag }}
          path: |
            ${{ env.BINARY }}
            ${{ env.BINARY }}.sha256
          retention-days: 30

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v5
        with:
          name: orbinum-runtime-wasm-${{ needs.metadata.outputs.image_tag }}
          path: |
            ${{ env.WASM }}
            ${{ env.WASM }}.sha256
          retention-days: 30

  # ── 3. Publish Docker image to GHCR ──────────────────────────────────────
  # Node binaries are updated via Watchtower following `testnet-latest` / `latest`.
  # No compilation: `build-contexts` replaces the Dockerfile's `artifacts` stage with
  # the files already verified in `build`, so the image carries exactly those bytes.
  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [metadata, build]
    # Pushing `latest` IS mainnet's binary rollout — Watchtower takes it from there — so it
    # waits for the mainnet reviewer. Testnet stays ungated: its tag push is already
    # GPG-checked, and the testnet environment only admits `main`, which a tag run is not.
    environment: ${{ needs.metadata.outputs.environment == 'mainnet' && 'mainnet' || '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The final stage (base image, user, /data, --chmod) comes from this Dockerfile:
          # a promotion runs on main, and must wrap the tag's binary in the tag's image.
          ref: v${{ needs.metadata.outputs.version }}

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: orbinum-*-${{ needs.metadata.outputs.image_tag }}
          path: dist
          merge-multiple: true

      - name: Verify checksums match the `build` job
        run: cd dist && sha256sum -c -- *.sha256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/node
          # Raw, not `type=semver`: a mainnet promotion runs from workflow_dispatch, where
          # github.ref is a branch and semver derivation would yield nothing.
          tags: |
            type=raw,value=${{ needs.metadata.outputs.image_tag }}
            type=raw,value=latest,enable=${{ needs.metadata.outputs.environment == 'mainnet' }}
            type=raw,value=testnet-latest,enable=${{ needs.metadata.outputs.environment == 'testnet' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-contexts: artifacts=./dist
          push: true
          platforms: linux/amd64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      # rc.23 published an image whose binary had no executable bit: CI chmods the
      # artifact on the RUNNER, and `upload-artifact` round-trips through a zip, which does
      # not preserve the bit. Every step was green and every node then died at startup with
      # `exec: ... permission denied`. Running the binary in the image we just pushed is
      # what makes "the image works" an assertion rather than an assumption.
      - name: Verify the published image actually runs
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/node@${{ steps.build.outputs.digest }}"
          echo "Running --version inside $IMAGE"
          docker run --rm --entrypoint /usr/local/bin/orbinum-node "$IMAGE" --version
          # And the runtime WASM it ships must be readable by the unprivileged user, since
          # runtime-upgrade.yml docker-cps it out for the on-chain setCode.
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'test -s /usr/local/share/orbinum/orbinum_runtime.compact.compressed.wasm'

      # Every tag this release pushed — the version AND the floating `<network>-latest`
      # that ~50 nodes follow through Watchtower — must resolve to the digest we just ran.
      # By construction they do (one push, many tags), so this exists for the day someone
      # re-tags by hand or a registry hiccup leaves the floating tag on an older manifest:
      # that is a fleet-wide rollout of the wrong image, and it should fail here, not there.
      - name: Verify every pushed tag resolves to the verified digest
        run: |
          WANT="${{ steps.build.outputs.digest }}"
          # A tag's digest is the sha256 of its manifest bytes as the registry stores them,
          # so `--raw | sha256sum` IS the resolution — no template field to get wrong, and
          # no dependence on the buildx version's `--format` support (the local desktop
          # build ignored `{{ .Manifest.Digest }}` outright).
          echo "${{ steps.docker_meta.outputs.tags }}" | while read -r TAG; do
            [ -n "$TAG" ] || continue
            GOT="sha256:$(docker buildx imagetools inspect "$TAG" --raw | sha256sum | cut -d' ' -f1)"
            if [ "$GOT" != "$WANT" ]; then
              echo "::error::$TAG resolves to $GOT, expected $WANT"; exit 1
            fi
            echo "ok  $TAG -> $GOT"
          done

  # ── 4. Create GitHub Release ──────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # After the image: a promotion the mainnet reviewer rejects must not leave a final
    # release behind for an image that was never pushed.
    needs: [metadata, build, docker-publish]
    # Created by the tag push (testnet assets, pre-release); the mainnet promotion
    # updates the same release with its own assets and drops the pre-release flag.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.metadata.outputs.version }}
          fetch-depth: 0 # release notes diff against the previous tag

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: orbinum-*-${{ needs.metadata.outputs.image_tag }}
          path: ./release-artifacts/

      - name: Package artifacts
        run: |
          # Asset names carry the flavour (`0.2.0-testnet` / `0.2.0`) so both builds of
          # one release sit side by side without overwriting each other.
          TAG="${{ needs.metadata.outputs.image_tag }}"
          find release-artifacts/ -name "orbinum-node" -not -name "*.sha256" \
            | xargs -I{} cp {} orbinum-node-linux-x86_64-${TAG}
          find release-artifacts/ -name "*.wasm" \
            | xargs -I{} cp {} orbinum-runtime-${TAG}.wasm
          sha256sum orbinum-node-linux-x86_64-${TAG} >> checksums-${TAG}.txt
          sha256sum orbinum-runtime-${TAG}.wasm >> checksums-${TAG}.txt

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          TAG="${{ needs.metadata.outputs.image_tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## Orbinum Node ${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          if [[ -n "$PREV_TAG" ]]; then
            echo "### Changes since ${PREV_TAG}" >> release_notes.md
            git log --oneline "${PREV_TAG}..HEAD" --no-merges >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "### Checksums (${TAG})" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          cat "checksums-${TAG}.txt" >> release_notes.md
          echo "\`\`\`" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          name: "Orbinum ${{ needs.metadata.outputs.version }}"
          # The mainnet run replaces the testnet body; the testnet assets stay attached.
          body_path: release_notes.md
          prerelease: ${{ needs.metadata.outputs.is_prerelease == 'true' }}
          files: |
            orbinum-node-linux-x86_64-${{ needs.metadata.outputs.image_tag }}
            orbinum-runtime-${{ needs.metadata.outputs.image_tag }}.wasm
            checksums-${{ needs.metadata.outputs.image_tag }}.txt
