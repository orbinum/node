name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Step 1: Format check (fast, no compilation)
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        # reads rust-toolchain.toml — includes rustfmt, no target needed here

      - name: Install taplo (TOML formatter)
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz \
            | gzip -d > taplo
          chmod +x taplo
          sudo mv taplo /usr/local/bin/taplo

      - name: Check code format
        run: make fmt-check

  # Step 2: check, clippy and the test variants run in parallel. `cargo check` emits no
  # codegen the tests could reuse, so gating them on it only delayed them.
  check:
    name: Check
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev protobuf-compiler

      - name: Cache cargo registry & git sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Rust toolchain
        run: make setup

      - name: Check workspace
        run: cargo check --release --workspace

      # zk-core and zk-verifier must build in a no_std/WASM context. Guard against
      # a consumer or feature change that leaks `std` into the runtime build.
      - name: Check zk primitives no_std feature matrix
        run: |
          cargo check -p orbinum-zk-core --no-default-features
          cargo check -p orbinum-zk-core --no-default-features --features poseidon-native
          cargo check -p orbinum-zk-verifier --no-default-features
          cargo check -p orbinum-zk-verifier --no-default-features --features groth16-native

  # Unit tests, one runner per feature set: each set is its own compile, so running them
  # in one job serialized three builds. A shared build job never matched their RUSTFLAGS,
  # features or the runtime WASM, so each variant compiles here (sccache-backed).
  unit-test:
    name: Unit Tests (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [fmt]
    strategy:
      matrix:
        include:
          - variant: default
            cmd: cargo test --release --lib --all
          - variant: benchmarks
            cmd: cargo test --release --lib --all --features=runtime-benchmarks,skip-proof-verification
    steps: &unit-test-steps
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev protobuf-compiler

      - name: Cache cargo registry & git sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Rust toolchain
        run: make setup

      - name: Run unit tests
        run: ${{ matrix.cmd }}
        env:
          CI_DUMMY_VK: "1"
          RUSTFLAGS: "-D warnings"

  # Short variant, held until `check` ends: one fewer job hitting the GHA cache at start
  # (rate-limited with 5 at once) while still finishing before `benchmarks`.
  unit-test-fast-runtime:
    name: Unit Tests (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [check]
    strategy:
      matrix:
        include:
          # `fast-runtime` changes the session, era, bonding and election constants.
          # SKIP_WASM_BUILD inline: wasm-builder skips on any value, even an empty one.
          - variant: fast-runtime
            cmd: SKIP_WASM_BUILD=1 cargo test --release --lib -p orbinum-runtime --features fast-runtime
    steps: *unit-test-steps

  # Clippy (check mode, its own feature set)
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev protobuf-compiler

      - name: Cache cargo registry & git sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Rust toolchain
        run: make setup

      - name: Run clippy
        run: make clippy-release
        env:
          CI_DUMMY_VK: "1"
