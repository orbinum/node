name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Step 1: Format check (fast, no compilation)
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        # reads rust-toolchain.toml — includes rustfmt, no target needed here

      - name: Install taplo (TOML formatter)
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz \
            | gzip -d > taplo
          chmod +x taplo
          sudo mv taplo /usr/local/bin/taplo

      - name: Check code format
        run: make fmt-check

  # Step 2: Check compilation (no binary generation)
  check:
    name: Check
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev protobuf-compiler

      - name: Cache cargo registry & git sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Rust toolchain
        run: make setup

      - name: Check workspace
        run: cargo check --release --workspace

      # zk-core and zk-verifier must build in a no_std/WASM context. Guard against
      # a consumer or feature change that leaks `std` into the runtime build.
      - name: Check zk primitives no_std feature matrix
        run: |
          cargo check -p orbinum-zk-core --no-default-features
          cargo check -p orbinum-zk-core --no-default-features --features poseidon-native
          cargo check -p orbinum-zk-verifier --no-default-features
          cargo check -p orbinum-zk-verifier --no-default-features --features groth16-native

  # Step 3a: Unit tests. Compiles in this job: a separate build job never matched its
  # RUSTFLAGS, features or the runtime WASM, so the tests recompiled everything anyway.
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev protobuf-compiler

      - name: Cache cargo registry & git sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Rust toolchain
        run: make setup

      - name: Run unit tests
        run: make test-release
        env:
          CI_DUMMY_VK: "1"
          RUSTFLAGS: "-D warnings"

  # Step 3b: Clippy (check mode, its own feature set; runs in parallel with tests)
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev protobuf-compiler

      - name: Cache cargo registry & git sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Rust toolchain
        run: make setup

      - name: Run clippy
        run: make clippy-release
        env:
          CI_DUMMY_VK: "1"
