# Not published to crates.io (its 2.0.0 is git-only), so this one stays on git. It is
# a [dev-dependencies] entry in client/{cli,db,rpc,mapping-sync} only — nothing in the
# runtime or node binary depends on it.
# Dev-dependency only, used by the vendored Frontier crates' own tests.
#
# It is NOT on crates.io (the published `0.0.0` is a yanked placeholder), so it can only
# come from git — which drags the whole SDK in from git alongside the registry copy the
# rest of the workspace uses. Cargo treats the two sources as different packages, so
# every `sp-*`/`sc-*` type exists twice and those TEST TARGETS fail to typecheck:
#
#   the trait bound `Client<..>: HeaderBackend<_>` is not satisfied
#   note: there are multiple different versions of crate `sp_blockchain`
#
# This affects ONLY `--all-targets` on fc-cli/fc-db/fc-rpc/fc-mapping-sync. The node,
# the runtime and every pallet build and test clean, because the dep is dev-only.
#
# Redirecting the SDK through `[patch.crates-io]` was tried and rejected: the patch set
# is not stable — each crate added reshuffles the resolution graph, and a set large
# enough to fix these four ends up splitting `sp-arithmetic`/`sp-core` and breaking
# crates that were previously fine, including our own. The real fix is upstream
# publishing this crate, or dropping these vendored tests. Tracked in
# MIGRACION_2606_TODO.md alongside the rest of the Frontier work.
substrate-wasm-builder = { version = "34.0.0" }

