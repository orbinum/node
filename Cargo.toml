pallet-validator-set = { path = "frame/validator-set", default-features = false }

# ── ISMP / Hyperbridge ────────────────────────────────────────────────────────
# Connects Orbinum to Polkadot via Hyperbridge WITHOUT becoming a parachain: the
# GRANDPA consensus client lets Hyperbridge VERIFY our finality proofs rather than
# take consensus over, so the sovereign validator set stays intact. `ismp-grandpa`
# is the solochain client — NOT `ismp-parachain`, which is for chains that borrow
# relay-chain consensus.
#
# These crates pin the crates.io `polkadot-sdk` umbrella by exact version
# (`=2512.3.2`), which is why every SDK dependency above is now a registry version
# rather than a git branch: a git/registry split duplicates `sp_io` and breaks the
# wasm build. See docs/governance/ismp-integration-notes.md.
pallet-ismp-messaging = { path = "frame/ismp-messaging", default-features = false }
pallet-ismp = { version = "2606.1.0", default-features = false }
pallet-ismp-runtime-api = { version = "2606.0.0", default-features = false }
pallet-ismp-rpc = { version = "2606.0.0" }
ismp = { version = "2606.1.0", default-features = false }
ismp-grandpa = { version = "2606.0.0", default-features = false }
# Types the consensus guard needs to decode: ConsensusState, FinalityProof.
grandpa-verifier-primitives = { version = "2606.0.0", default-features = false }
# `IsmpRouter::module_for_id` returns `anyhow::Error`.
anyhow = { version = "1.0", default-features = false }

# Frontier / Orbinum pallets (continued)
pallet-zk-verifier = { path = "frame/zk-verifier", default-features = false }
pallet-zk-verifier-rpc = { path = "frame/zk-verifier/rpc" }
pallet-zk-verifier-runtime-api = { path = "frame/zk-verifier/runtime-api", default-features = false }
# Frontier Utility
precompile-utils = { path = "precompiles", default-features = false }
# Frontier Template
orbinum-runtime = { path = "template/runtime", default-features = false }

[profile.release]
# Substrate runtime requires unwinding.
panic = "unwind"

[profile.production]
inherits = "release"
# Sacrifice compile speed for execution speed by using optimization flags:
# https://doc.rust-lang.org/rustc/linker-plugin-lto.html
lto = true
# https://doc.rust-lang.org/rustc/codegen-options/index.html#codegen-units
codegen-units = 1

# Patch Substrate dependencies for local development
[patch.crates-io]
# SDK crates are consumed from crates.io directly, so no source redirection is needed
# here. (They used to come from git, which forced a large patch table to keep cargo
# from seeing two copies of every SDK type.)
orbinum-zk-core = { path = "primitives/zk-core" }
