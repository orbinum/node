# ─────────────────────────────────────────────────────────────────────────────
# Orbinum Testnet — PRIVATE RPC node (internal use).
#
# A full node that syncs the testnet and serves RPC on localhost for a consumer
# co-located with it (an indexer, an app, a script). Unlike docker-compose.rpc.yml
# (a public endpoint with Caddy + TLS + a domain), this one:
#   - serves RPC on localhost ONLY by default (no --rpc-external) — nothing
#     reachable from the internet, no firewall mistake possible out of the box,
#   - has no Caddy / TLS / public domain,
#   - is NOT a bootnode (its PeerId isn't in the spec), so RPC_NODE_KEY can be
#     any value and may change freely.
#
# ── Peering: reach the existing RPC nodes by their PRIVATE IP via RESERVED_NODES
#    in .env (the same mechanism the validators use):
#      RESERVED_NODES=--reserved-nodes /ip4/<rpc-ip>/tcp/30333/p2p/<rpc PeerId> ...
#    This is required when the spec's bootNodes are public DNS names behind a
#    proxy/CDN that does not route P2P (port 30333): dialing them by domain fails
#    and the node stays at 0 peers, so peer by IP instead. Do NOT add
#    --reserved-only — that would isolate the node and block other gossip.
#
# Setup:
#   cp .env.rpc.example .env     # fill RPC_NODE_KEY and RESERVED_NODES
#   docker compose -f docker-compose.private-rpc.yml up -d
#
# Consume it from the same machine:
#   ws://127.0.0.1:9944   (Substrate)   http://127.0.0.1:9944   (EVM/JSON-RPC)
#
# Need it reachable from another machine? See the TWO commented lines in the
# command below, and FIREWALL the box.
services:
  orbinum-private-rpc:
    image: ${ORBINUM_IMAGE:-ghcr.io/orbinum/node:testnet-latest}
    platform: linux/amd64
    container_name: orbinum-private-rpc
    network_mode: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      --chain /chain-specs/testnet-spec.json
      --name "${RPC_NAME:-Orbinum-Private-RPC}"
      --base-path /data
      --listen-addr /ip4/0.0.0.0/tcp/30333
      --node-key ${RPC_NODE_KEY}
      ${RESERVED_NODES}
      --rpc-port 9944
      --rpc-methods Safe
      --rpc-max-connections 100
      --db-cache ${RPC_DB_CACHE:-512}
      --trie-cache-size ${RPC_TRIE_CACHE:-67108864}
      --no-mdns
      --log info
    # ── To reach RPC from OTHER machines, uncomment BOTH lines below AND set up a
    #    firewall (e.g. ufw allow from <your-subnet> to any port 9944). Without a
    #    firewall this opens your node's RPC to the whole internet.
    #   --rpc-external
    #   --rpc-cors all          # needed only if a browser will call it directly
    #
    # ── Archive node? The default is pruned (enough to follow the chain and serve
    #    recent state). For full history (re-indexing from block 0, deep queries)
    #    add:  --state-pruning archive --blocks-pruning archive  (and a bigger disk).
    volumes:
      - private-rpc-data:/data
      - ./testnet-spec.json:/chain-specs/testnet-spec.json:ro
    restart: unless-stopped
    mem_limit: ${RPC_MEM_LIMIT:-3g}
    cpus: ${RPC_CPUS:-1.5}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: orbinum-watchtower-private-rpc
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_LOG_LEVEL: "info"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  private-rpc-data:
