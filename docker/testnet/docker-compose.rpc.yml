services:
  rpc-node:
    image: ${ORBINUM_IMAGE:-ghcr.io/orbinum/node:testnet-latest}
    platform: linux/amd64
    container_name: orbinum-rpc-node
    network_mode: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      --chain /chain-specs/testnet-spec.json
      --name "${RPC_NAME:-Orbinum-RPC}"
      --base-path /data
      --port 30333
      --node-key ${RPC_NODE_KEY}
      --rpc-port 9944
      --rpc-cors all
      --rpc-methods Safe
      --no-mdns
      --no-private-ipv4
      --telemetry-url "/dns4/telemetry.polkadot.io/tcp/443/x-parity-wss/%2Fsubmit%2F 0"
      --prometheus-external
      --prometheus-port 9615
      --log info
    volumes:
      - rpc-node-data:/data
      - ./testnet-spec.json:/chain-specs/testnet-spec.json:ro
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: orbinum-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_LOG_LEVEL: "info"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  rpc-node-data:
