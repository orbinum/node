services:
  rpc-node:
    image: ${ORBINUM_IMAGE:-ghcr.io/orbinum/node:testnet-latest}
    platform: linux/amd64
    container_name: orbinum-rpc-node
    # Host networking: the container shares the host's network stack, inheriting
    # its routable IPv6. Required because telemetry.polkadot.io resolves to
    # IPv6-only and Docker bridge networks have no IPv6 by default.
    # With host networking the "ports:" mapping is ignored — the node binds
    # directly to the host interfaces:
    #   --rpc-port 9944  : NOT --rpc-external, so it binds 127.0.0.1 only
    #                      (Nginx proxies it; firewall still blocks 9944 anyway)
    #   --port 30333     : public P2P (this node is a bootnode)
    #   9615 Prometheus  : restrict via firewall to your monitoring host
    network_mode: host
    command: >
      --chain /chain-specs/testnet-spec.json
      --name "${RPC_NAME:-Orbinum-RPC}"
      --base-path /data
      --port 30333
      --node-key ${RPC_NODE_KEY}
      --rpc-port 9944
      --rpc-cors all
      --rpc-methods Safe
      --no-mdns
      --no-private-ipv4
      --prometheus-external
      --prometheus-port 9615
      --log info
    volumes:
      - rpc-node-data:/data
      - ./testnet-spec.json:/chain-specs/testnet-spec.json:ro
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower
    container_name: orbinum-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_LOG_LEVEL: "info"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  rpc-node-data:
