services:
  rpc-node:
    image: ${ORBINUM_IMAGE:-ghcr.io/orbinum/node:testnet-latest}
    platform: linux/amd64
    container_name: orbinum-rpc-node
    command: >
      --chain /chain-specs/testnet-spec.json
      --name "${RPC_NAME:-Orbinum-RPC}"
      --base-path /data
      --port 30333
      --node-key ${RPC_NODE_KEY}
      --rpc-port 9944
      --rpc-external
      --rpc-cors all
      --rpc-methods Safe
      --no-mdns
      --no-private-ipv4
      --prometheus-external
      --prometheus-port 9615
      --log info
    volumes:
      - rpc-node-data:/data
      - ./testnet-spec.json:/chain-specs/testnet-spec.json:ro
    ports:
      - "127.0.0.1:9944:9944" # RPC — localhost only, proxied by Nginx + TLS
      - "30333:30333"         # P2P — PUBLIC. This node is a bootnode.
      - "9615:9615"           # Prometheus — optional, firewall to monitoring only
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower
    container_name: orbinum-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_LOG_LEVEL: "info"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  rpc-node-data:
